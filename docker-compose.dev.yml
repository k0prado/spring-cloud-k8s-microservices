version: "3.9"
services:
  ecom-app-dev:
    image: maven:3.9.16-eclipse-temurin-26
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - ~/.m2:/root/.m2
    working_dir: /workspace
    command: mvn -DskipTests -Dspring-boot.run.fork=false spring-boot:run
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
