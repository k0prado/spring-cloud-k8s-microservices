spring:
    application:
        name: ecom-app
    h2:
        console:
            enabled: true
            settings:
                web-allow-others: true
    datasource:
        url: jdbc:h2:mem:test;MODE=MySQL
        driverClassName: org.h2.Driver
        hikari:
            maximum-pool-size: 5
    jpa:
        show-sql: false
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect
                jdbc:
                    batch_size: 20
                    use_getgeneratedkeys: true
                order_inserts: true
                order_updates: true